services:
  minio:
    image: quay.io/minio/minio:${MINIO_IMAGE_TAG:-RELEASE.2025-09-07T16-13-09Z}
    container_name: infra_minio
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    networks:
      - infra

  minio-init:
    image: minio/mc:${MINIO_MC_IMAGE_TAG:-latest}
    container_name: infra_minio_init
    restart: "no"
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb -p "local/$${MINIO_BUCKET:-uploads}" || true
        echo "minio bucket ready: $${MINIO_BUCKET:-uploads}"
    networks:
      - infra

volumes:
  minio_data:
    name: infra_minio_data

networks:
  infra:

version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (*go.uber.org/zap.SugaredLogger).Sync
        - (*database/sql.Tx).Rollback
        - (*github.com/jackc/pgx/v5.Tx).Rollback
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
          disabled: true
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: var-naming
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      - path: docs/
        linters:
          - all
      - path: _test\.go
        linters:
          - errcheck
          - revive

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Yab1/golang-template
